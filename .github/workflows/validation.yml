name: Validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: validation-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validation:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted dependency authorization helper
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.user.login == 'dependabot[bot]'
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Authorize Dependabot update before checking out its head
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.user.login == 'dependabot[bot]'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          changed_files="${RUNNER_TEMP}/dependabot-changed-files"
          commits="${RUNNER_TEMP}/dependabot-commits.json"
          gh api --paginate \
            "repos/${REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" \
            --jq '.[].filename' > "${changed_files}"
          gh api --paginate --slurp \
            "repos/${REPOSITORY}/pulls/${PR_NUMBER}/commits?per_page=100" \
            > "${commits}"
          node .github/scripts/dependabot-auto-merge.mjs \
            "${GITHUB_EVENT_PATH}" "${changed_files}" "${commits}"

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Cache ESPHome and PlatformIO
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            .esphome/external_components
          key: ${{ runner.os }}-validation-${{ github.event.pull_request.head.repo.full_name || github.repository }}-esphome-pio-${{ hashFiles('pyproject.toml', 'uv.lock', 'rtl433-esphome-heltec-lora-32-v2.yaml', 'components/rtl433_native/__init__.py') }}
          restore-keys: |
            ${{ runner.os }}-validation-${{ github.event.pull_request.head.repo.full_name || github.repository }}-esphome-pio-

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Run tests
        run: ./.venv/bin/pytest

      - name: Prepare ESPHome config secrets
        run: cp secrets.yaml.example secrets.yaml

      - name: Compile PR component firmware
        run: ./scripts/build
        env:
          RTL433_ESPHOME_URL: https://github.com/${{ github.event.pull_request.head.repo.full_name || github.repository }}.git
          RTL433_ESPHOME_REF: ${{ github.event.pull_request.head.sha || github.sha }}
